name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish
        run: >-
          dotnet publish src/Kyklos/Kyklos.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish

      - name: Package the release zip
        shell: pwsh
        run: |
          $version = ($env:GITHUB_REF_NAME -replace '^v', '')
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $version = "dev-$([System.DateTime]::UtcNow.ToString('yyyyMMdd-HHmm'))" }
          $zip = "Kyklos-$version-win-x64.zip"
          Compress-Archive -Path "publish/Kyklos.exe", "Install.ps1", "Install.cmd" -DestinationPath $zip
          "ZIP_NAME=$zip"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "selftest"
          & (Join-Path (Get-Location) "publish/Kyklos.exe") --selftest $dir all
          if ($LASTEXITCODE -ne 0) {
              Get-Content (Join-Path $dir "selftest-report.txt") | ForEach-Object { "::error::$_" }
              exit $LASTEXITCODE
          }

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:ZIP_NAME `
              --title "Kyklos $env:ZIP_VERSION" `
              --generate-notes --latest
